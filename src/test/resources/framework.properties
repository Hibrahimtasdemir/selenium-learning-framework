base.url=https://the-internet.herokuapp.com
api.base.url=https://jsonplaceholder.typicode.com
api.auth.type=none
api.auth.token=
api.auth.key.name=X-API-Key
api.auth.key.value=
api.auth.key.in=header
# Optional when api.auth.type=bearer|login
api.auth.header.name=Authorization
api.auth.scheme=Bearer
# Optional when api.auth.type=login
api.auth.login.path=/auth/login
api.auth.login.username.field=username
api.auth.login.password.field=password
api.auth.login.username=
api.auth.login.password=
api.auth.login.token.json.path=token
api.users.path=/users
# jsonplaceholder has no /orders resource, so /posts is used as default demo path.
api.orders.path=/posts
api.contract.validation.enabled=false
api.contract.openapi.spec.path=openapi/openapi-jsonplaceholder.yaml
api.users.sample.id=1
api.orders.sample.id=1
api.users.id.field=id
api.orders.id.field=id
api.users.assert.echo.fields=name,username,email
api.orders.assert.echo.fields=orderNumber,status,amount
api.users.response.schema.path=schemas/users/user-response.schema.json
api.orders.response.schema.path=schemas/orders/order-response.schema.json
api.delete.response.schema.path=schemas/posts/delete-response.schema.json
api.users.create.payload.path=payloads/users/create-user.json
api.users.update.payload.path=payloads/users/update-user.json
api.orders.create.payload.path=payloads/orders/create-order.json
api.orders.update.payload.path=payloads/orders/update-order.json
# For real environments, prefer environment variables for secrets/config:
# API_BASE_URL, API_AUTH_TYPE, API_AUTH_TOKEN, API_AUTH_KEY_NAME, API_AUTH_KEY_VALUE, API_AUTH_KEY_IN
# API_AUTH_HEADER_NAME, API_AUTH_SCHEME, API_AUTH_LOGIN_PATH, API_AUTH_LOGIN_USERNAME_FIELD
# API_AUTH_LOGIN_PASSWORD_FIELD, API_AUTH_LOGIN_USERNAME, API_AUTH_LOGIN_PASSWORD
# API_AUTH_LOGIN_TOKEN_JSON_PATH, API_USERS_PATH, API_ORDERS_PATH, API_USERS_SAMPLE_ID
# API_ORDERS_SAMPLE_ID, API_USERS_ID_FIELD, API_ORDERS_ID_FIELD, API_USERS_ASSERT_ECHO_FIELDS
# API_ORDERS_ASSERT_ECHO_FIELDS, API_USERS_RESPONSE_SCHEMA_PATH, API_ORDERS_RESPONSE_SCHEMA_PATH
# API_DELETE_RESPONSE_SCHEMA_PATH, API_USERS_CREATE_PAYLOAD_PATH, API_USERS_UPDATE_PAYLOAD_PATH
# API_ORDERS_CREATE_PAYLOAD_PATH, API_ORDERS_UPDATE_PAYLOAD_PATH
# API_CONTRACT_VALIDATION_ENABLED, API_CONTRACT_OPENAPI_SPEC_PATH
browser=chrome
headless=false
demo.pause.ms=1000
retry.count=1
report.directory=test-output/report
report.file.name=automation-report.html
