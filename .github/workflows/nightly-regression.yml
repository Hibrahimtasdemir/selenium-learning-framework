name: Nightly Regression

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-regression:
    name: Nightly Regression
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Regression Suite
        run: mvn -B -q "-DsuiteXmlFile=testng.xml" "-Dheadless=true" "-Ddemo.pause.ms=0" test

      - name: Generate Allure Report
        if: always()
        run: mvn -B -q allure:report

      - name: Upload Nightly Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-regression-artifacts
          retention-days: 14
          path: |
            target/surefire-reports/**
            target/allure-results/**
            target/site/allure-maven-plugin/**
            test-output/report/**
